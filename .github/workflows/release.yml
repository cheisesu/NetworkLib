name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - master
  push:
    branches:
      - "9-add-github-action-of-release-changelog-constructing"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  changelog:
    name: Generate Changelog
    # if: >-
    #   github.event.pull_request.merged == true &&
    #   github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          override-version: "0.0.1"

      - name: Generate changelog
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const generate = require('./.github/scripts/generate-changelog.js');
            await generate({ github, context });

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ steps.version.outputs.version }}
          path: changelog-${{ steps.version.outputs.version }}.md
          retention-days: 7
          if-no-files-found: error
