name: Validate Release

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - milestoned
      - demilestoned
      - labeled
      - unlabeled
    branches:
      - master
      - develop

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate_pr:
    name: Validate Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR branches
        if: github.base_ref == 'master' && github.head_ref != 'develop'
        run: |
          echo "::error::Release PR must be from develop to master"
          exit 1

      - name: Validate PR label
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          echo "::error::Release PR must have the 'release' label"
          exit 1

      - name: Resolve version
        uses: ./.github/actions/resolve-version
