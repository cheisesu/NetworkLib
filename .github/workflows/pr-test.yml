name: Build & Test Package
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'develop'
      - 'master'
jobs:
  build:
    name: Build package with Swift ${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        swift: ["6"]
    steps:
      - name: Install SwiftLint
        run: |
          brew install swiftlint
          echo "SWIFTLINT_PATH=$(which swiftlint)" >> "$GITHUB_ENV"
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}
          skip-signature-verification: true
      - name: Swift-version
        run: swift --version
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Build
        run: |
          set -o pipefail
          swift build --very-verbose 2>&1
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."

  testing:
    name: Test ${{ matrix.platform }} ${{ matrix.version }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: iOS
          #   version: "18.5"
          #   runner: macos-15
          #   xcode: "16.4"
          #   destination: "platform=iOS Simulator,name=iPhone 16,OS=18.5"

          # - platform: iOS
          #   version: "26"
          #   runner: macos-26
          #   xcode: "26.6"
          #   destination: "platform=iOS Simulator,name=iPhone 17,OS=26.6"

          # - platform: tvOS
          #   version: "18.5"
          #   runner: macos-15
          #   xcode: "16.4"
          #   destination: "platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=18.5"

          # - platform: tvOS
          #   version: "26"
          #   runner: macos-26
          #   xcode: "26.6"
          #   destination: "platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=26.6"

          # - platform: macOS
          #   version: "15"
          #   runner: macos-15
          #   xcode: "16.4"
          #   destination: "platform=macOS"

          - platform: macOS
            version: "26"
            runner: macos-26
            xcode: "26.6"
            destination: "platform=macOS"

    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SwiftLint
        run: |
          brew install swiftlint
          echo "SWIFTLINT_PATH=$(which swiftlint)" >> "$GITHUB_ENV"

      - name: Check Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run tests
        run: |
          set -o pipefail

          xcodebuild test \
            -scheme NetworkLib \
            -configuration Debug \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            TVOS_DEPLOYMENT_TARGET=16.0 \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGN_IDENTITY=-

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.platform }}-${{ matrix.version }}
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
          if-no-files-found: warn
  ci-check:
    name: Check build and test results
    runs-on: ubuntu-latest
    needs: [build, testing]
    if: always()

    steps:
      - name: Check results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.testing.result }}
        run: |
          [[ "$BUILD_RESULT" == "success" ]] &&
          [[ "$TEST_RESULT" == "success" ]]